name: validation

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev,ml,service]"
      - run: python -m unittest discover -s tests/python -v
      - run: python -m compileall -q ml services tests/python scripts
      - run: python -m ruff check ml services tests/python scripts

  desktop:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - run: node --check electron/main.cjs
      - run: node --check electron/preload.cjs
      - run: node --check electron/ipc-policy.cjs
      - run: npm run test:main
      - run: npm run build
      - run: npm audit --audit-level=low
